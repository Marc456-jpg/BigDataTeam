# =====================================================================
# config/pipeline.yaml
# Configuracion del pipeline del proyecto Steam Reviews.
#
# Por que existe este archivo: el apartado E del enunciado pide que las
# rutas y los parametros (ubicacion de los datos, columna de particion...)
# esten en un archivo de configuracion SEPARADO del codigo, no escritos
# dentro de los scripts. Asi, para cambiar una ruta no hay que tocar codigo.
#
# Quien lo lee: run_pipeline.py (el punto de entrada unico) y todos los
# scripts de Spark y de ingesta. Ningun script lleva rutas ni parametros
# escritos dentro: todos salen de aqui (decision 66, 19 oct).
#
# Formato YAML: "clave: valor", y la sangria (2 espacios) indica que una
# clave esta dentro de otra. Lo que va detras de "#" es un comentario.
# =====================================================================

dataset:
  # Identificador del dataset en Kaggle, con la forma <propietario>/<nombre>
  kaggle_id: najzeko/steam-reviews-2021
  # Nombre del CSV que viene dentro del zip de Kaggle
  archivo: steam_reviews.csv
  # Tamano exacto del CSV en bytes. Sirve para dos cosas:
  #   1) comprobar que la descarga (o la subida a HDFS) esta completa;
  #   2) no repetirla si ya esta hecha (re-ejecuciones idempotentes).
  tamano_bytes: 8171787229

local:
  # Carpeta (relativa a la raiz del repositorio) donde se guarda el CSV.
  # Esta en .gitignore: el dataset NUNCA se sube a GitHub.
  carpeta_datos: data
  # Carpeta con las credenciales de Kaggle (access_token o kaggle.json).
  # Tambien esta en .gitignore: las claves NUNCA se suben a GitHub.
  carpeta_secretos: secrets

entorno:
  # Como se lanzan los pasos dentro de los contenedores (lo usa run_pipeline.py).
  # Los nombres de los contenedores son los del docker-compose.yml.
  # Contenedor con Spark y PySpark: el driver de todos los programas de Spark
  contenedor_spark: jupyter
  # Usuario con el que se lanzan los programas de Spark (el de la imagen)
  usuario_spark: jovyan
  # Carpeta del proyecto vista desde DENTRO de jupyter (el volumen del compose)
  carpeta_proyecto: /home/jovyan/work
  # Lanzador de los programas de Spark dentro de jupyter
  spark_submit: /usr/local/spark/bin/spark-submit
  # Nivel de los mensajes de Spark (WARN quita ~1.300 lineas de informacion)
  nivel_log_spark: WARN
  # Contenedor desde el que se usan los comandos de HDFS y Hadoop
  contenedor_hdfs: namenode
  # YARN: perfil del compose y sus dos servicios (solo para el MapReduce)
  perfil_yarn: yarn
  servicios_yarn: [resourcemanager, nodemanager]
  # JAR de Hadoop Streaming dentro del contenedor namenode
  jar_streaming: /opt/hadoop-3.2.1/share/hadoop/tools/lib/hadoop-streaming-3.2.1.jar
  # Carpeta temporal del contenedor namenode a la que se copian mapper y reducer
  carpeta_temporal_hdfs: /tmp

hdfs:
  # Direccion del NameNode: nombre del contenedor + puerto de HDFS
  namenode: hdfs://namenode:9000
  # Zonas de HDFS (decision 39 del documento explicativo)
  raw: /raw
  curada: /curada
  resultados: /resultados
  # Cuarentena: filas que no pasan las reglas de calidad (decision 53)
  cuarentena: /quarantine

spark:
  # Direccion del master de Spark (contenedor spark-master, puerto 7077)
  master: spark://spark-master:7077
  # Memoria del driver (el programa que se ejecuta en el contenedor jupyter)
  # y de cada executor (en spark-worker). Caben en los topes del compose.
  memoria_driver: 1g
  # Executor: 1536m (antes 1g; decision 61, 19 oct). Con 1 GB y 4 tareas a la
  # vez, el ETL se quedo sin memoria al leer y escribir Parquet (18 y 19 oct).
  # El worker ofrece 2 GB a los executors (SPARK_WORKER_MEMORY=2g) y su
  # contenedor tiene un tope de 2816 MB: 1,5 GB caben con margen.
  memoria_executor: 1536m
  # Zona horaria de las fechas: UTC (decision del 16 oct), para que el
  # ano y el mes de cada resena no dependan del PC donde se ejecute
  zona_horaria: UTC
  # Copias de cada bloque que escriba Spark en HDFS (solo hay 2 DataNodes)
  replicacion_hdfs: 2
  # Numero de particiones de los "shuffles" (agrupaciones). Con 4 nucleos,
  # 32 es suficiente; el valor por defecto (200) crearia tareas diminutas.
  particiones_shuffle: 32

etl:
  # CSV original en la zona raw (lo subio el mini-paso 2.2)
  csv_raw: /raw/steam_reviews.csv
  # Zona de paso: primera escritura en Parquet, particionada por ano y mes,
  # que sirve para MEDIR el tamano de cada particion. Se borra al terminar.
  staging: /curada/staging_reviews
  # Resultado final: datos limpios en Parquet (zona curada)
  salida: /curada/reviews
  # Columna(s) de particion de la salida:
  #   auto       -> se decide midiendo (ver umbral)
  #   year       -> una carpeta por ano
  #   year_month -> una carpeta por ano y mes (lo que decia la inscripcion)
  particion: auto
  # Criterio de "auto": si la particion ano+mes tipica (mediana) pesa al
  # menos esto, se usa year_month; si no, year. 128 MB = 1 bloque de HDFS
  # (el enunciado pide particiones de "cientos de MB, no de KB").
  umbral_mb_particion: 128
  # Numero de tareas al escribir la zona de paso (4 nucleos x 4)
  particiones_staging: 16
  # Tamano (MB) de cada "grupo de filas" (row group) de los archivos Parquet.
  # Quien lee Parquet carga un grupo entero en memoria. Con el valor por
  # defecto (128 MB) y 4 tareas a la vez, el executor de 1 GB se quedaba sin
  # memoria (OutOfMemoryError del 18 oct). Con 16 MB, cada tarea carga 8 veces
  # menos.
  parquet_grupo_filas_mb: 16
  # Rango valido de fechas de creacion de las resenas (UTC). Steam nacio
  # en 2003 y el dataset se descargo a principios de 2021.
  fecha_minima: "2003-09-12"
  fecha_maxima: "2021-12-31"
  # Informe de calidad de datos (en HDFS, zona resultados)
  informe_calidad: &informe_calidad /resultados/calidad/etl_reviews.json
  # Filas invalidas (corruptas, sin columna clave o con fecha fuera de rango),
  # guardadas en JSON con una columna "motivo" para poder revisarlas
  # (decision 53, aprobada por el profesor el 19 oct)
  cuarentena: &cuarentena /quarantine/reviews

mapreduce:
  # Entrada del job de MapReduce (apartado C): una linea por resena con
  # "app_id<TAB>recommended". La crea src/procesamiento/exportar_entrada_mapreduce.py
  # a partir de la zona curada. Hace falta porque Hadoop Streaming lee linea a
  # linea y el CSV original tiene saltos de linea dentro de las resenas.
  entrada: /curada/mapreduce_entrada
  # Numero de archivos de esa entrada (= numero de tareas map en Hadoop)
  archivos_entrada: 8
  # Resultado: "app_id<TAB>resenas<TAB>positivas<TAB>porcentaje" por juego
  salida: &mr_salida /resultados/mapreduce/positivos_por_juego
  # Resultado del mismo calculo hecho con RDDs de Spark (para comparar)
  salida_rdd: &rdd_salida /resultados/rdd/positivos_por_juego
  # Mapper y reducer de Hadoop Streaming: carpeta del repositorio donde estan,
  # nombres de los dos archivos e interprete con el que se ejecutan en YARN
  carpeta_scripts: mapreduce/positivos_por_juego
  mapper: mapper_positivos.py
  reducer: reducer_positivos.py
  interprete: python3

catalogo:
  # Tabla auxiliar: catalogo de juegos de la API publica de la tienda de Steam
  # (no necesita cuenta ni clave). La descarga src/ingesta/descargar_catalogo.py
  url_api: https://store.steampowered.com/api/appdetails
  # Idioma y pais fijos (ingles, EE. UU.) para que los datos no dependan de
  # donde se ejecute el script. Los precios salen en dolares.
  idioma: english
  pais: us
  # Segundos de pausa entre peticiones: Steam admite unas 200 cada 5 minutos
  pausa_s: 1.5
  # Reintentos si Steam responde "demasiadas peticiones" o falla la red
  reintentos: 4
  # Respuestas crudas, tal cual, una linea JSON por juego (zona raw)
  raw: /raw/games/appdetails.jsonl
  # Catalogo limpio en Parquet (zona curada; lo crea el mini-paso 3.8)
  salida: /curada/games

consultas:
  # Q1: top de juegos por % de resenas positivas, solo juegos con al menos
  # este numero de resenas (con pocas resenas el porcentaje no es fiable)
  q1_min_resenas: 1000
  q1_top: 10
  # Q3: ano analizado (2020: el ultimo completo; 2021 solo tiene 3 semanas)
  # y cuantos juegos por idioma
  q3_anio: 2020
  q3_top: 5
  # Donde se guarda cada respuesta (zona resultados de HDFS)
  salida_q1: &q1 /resultados/q1
  salida_q2: &q2 /resultados/q2
  salida_q3: &q3 /resultados/q3
  # Optimizacion medida de Q1 (src/analisis/optimizar_q1.py): veces que se
  # mide cada version (se queda el mejor tiempo), y donde se guardan sus planes
  # de ejecucion (carpeta del repositorio + comienzo del nombre de cada archivo)
  repeticiones_optimizacion: 2
  carpeta_planes: evidence/fase5
  prefijo_planes: 5.2_plan_

comparar_formatos:
  # CSV frente a Parquet (src/procesamiento/comparar_formatos.py, apartado B).
  # Cada consulta se mide varias veces y se da la mediana (con el minimo y el
  # maximo), para que el resultado no dependa de una sola medida.
  repeticiones: 3
  informe: &comparativa_formatos /resultados/comparativa/csv_vs_parquet.json

ml:
  # Modelo de la decision 50: LogisticRegression que predice "recommended"
  # (si la resena recomienda el juego). Lo entrena src/ml/modelo_recomendacion.py
  # Parte de las resenas que se usan (1.0 = todas). Se puede cambiar al
  # lanzarlo con --fraccion (por ejemplo 0.1 para medir el tiempo con el 10 %)
  fraccion: 1.0
  # Parte de los datos que se aparta para evaluar (el resto, para entrenar)
  proporcion_test: 0.2
  # Semilla del azar: con la misma semilla salen la misma muestra y la misma
  # separacion entrenamiento/prueba (resultados repetibles)
  semilla: 42
  # Idiomas con columna propia (los mas frecuentes); el resto cuenta como "otros"
  idiomas_top: 10
  # Un genero tiene columna propia si lo tiene al menos este % de los juegos
  min_pct_juegos_genero: 10
  # Maximo de iteraciones del entrenamiento (para antes si ya ha convergido)
  iteraciones_max: 50
  # Tamano maximo (MB) de cada trozo al leer el Parquet (tarea 6.6). Con 128 MB
  # (valor de Spark) el executor de 1 GB se quedo sin memoria con todo el
  # dataset; con 32 MB cada tarea maneja unas 4 veces menos datos
  mb_por_particion: 32
  # Resultados (zona resultados de HDFS)
  salida_informe: &ml_informe /resultados/ml/regresion_logistica.json
  salida_modelo: /resultados/ml/modelo_regresion_logistica

pipeline:
  # Punto de entrada unico: python run_pipeline.py (decision 54)
  # Segundos maximos de espera a que YARN este listo antes del MapReduce
  espera_yarn_s: 240
  # Comparacion automatica MapReduce frente a RDD (la escribe el paso 13)
  comparativa_mr_rdd: &comparativa_mr /resultados/comparativa/mapreduce_vs_rdd.json

exportar:
  # Carpeta del repositorio (relativa a la raiz) donde se copian los resultados
  # pequenos de HDFS (Q1-Q3, MapReduce, calidad, comparativas, ML y cuarentena)
  # para que queden en GitHub. La crea src/analisis/exportar_resultados.py
  carpeta_local: evidence/resultados
  # Tamano maximo de cada archivo copiado (KB): solo resultados pequenos,
  # nunca datos de resenas
  max_kb_por_archivo: 1024
  # Que se copia: ruta en HDFS (con "*" se reutiliza la ruta definida arriba),
  # nombre del archivo en el repositorio y si es un CSV con cabecera
  archivos:
    - {hdfs: *q1, local: q1_top_juegos_pct_positivo.csv, csv: true}
    - {hdfs: *q2, local: q2_horas_al_resenar.csv, csv: true}
    - {hdfs: *q3, local: q3_top5_por_idioma_2020.csv, csv: true}
    - {hdfs: *mr_salida, local: mapreduce_positivos_por_juego.tsv, csv: false}
    - {hdfs: *rdd_salida, local: rdd_positivos_por_juego.tsv, csv: false}
    - {hdfs: *informe_calidad, local: calidad_etl_reviews.json, csv: false}
    - {hdfs: *comparativa_formatos, local: comparativa_csv_vs_parquet.json, csv: false}
    - {hdfs: *comparativa_mr, local: comparativa_mapreduce_vs_rdd.json, csv: false}
    - {hdfs: *ml_informe, local: ml_regresion_logistica.json, csv: false}
    # Filas que el ETL mando a cuarentena, con su motivo (decision 53)
    - {hdfs: *cuarentena, local: cuarentena_reviews.json, csv: false}
