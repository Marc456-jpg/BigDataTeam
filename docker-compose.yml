# =====================================================================
#  docker-compose.yml del proyecto Steam Reviews (Entrega 1)
#  Equipo: Manu, Marc y Nora
#
#  VERSION ACTUAL (mini-paso 1.5): HDFS + Spark + Jupyter + YARN (este ultimo en el perfil "yarn")
#  Arranque normal (HDFS + Spark + Jupyter): docker compose up -d
#  Con YARN (solo para MapReduce):      docker compose --profile yarn up -d
#  Parar YARN:                          docker compose --profile yarn stop resourcemanager nodemanager
#    - namenode     : el indice de HDFS (web en http://localhost:9870)
#    - datanode1    : guarda bloques (copia 1)
#    - datanode2    : guarda bloques (copia 2)
#    - spark-master : reparte el trabajo de Spark (web en http://localhost:8080)
#    - spark-worker : ejecuta las tasks de Spark (web en http://localhost:8081)
#    - resourcemanager (perfil yarn): reparte memoria y CPU a MapReduce (web en http://localhost:8088)
#    - nodemanager     (perfil yarn): ejecuta las tareas de MapReduce (con Python 3 para Hadoop Streaming)
#    - jupyter      : nuestro entorno de desarrollo con PySpark (http://localhost:8888/lab?token=steam)
#                     y la web de Spark de cada programa (http://localhost:4040)
#
#  Basado en el docker-compose.yml del profesor (docker/docker-compose.yml)
# =====================================================================

# Nombre del proyecto: Docker lo usa como prefijo de redes y volumenes
# (por ejemplo, el volumen "steam-bigdata_hadoop_namenode").
name: steam-bigdata

services:

  # ------------------------------------------------------------------
  # NameNode: sabe DONDE esta cada bloque. Nunca guarda datos.
  # ------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode             # nombre legible dentro de la red (en vez del ID del contenedor)
    restart: unless-stopped        # se reinicia solo, salvo si lo paramos a mano
    ports:
      - "9870:9870"                # web del NameNode
      - "9000:9000"                # puerto por el que los clientes hablan con HDFS
    # Script de arranque propio (igual que el de la imagen, pero con "exec"):
    # asi Java es el proceso 1 y se apaga ordenadamente (codigo 143, no 137)
    command: ["/bin/bash", "/opt/steam/run-namenode.sh"]
    volumes:
      - hadoop_namenode:/hadoop/dfs/name   # el indice se guarda en un volumen (no se pierde al apagar)
      - ./docker/run-namenode.sh:/opt/steam/run-namenode.sh:ro   # ":ro" = solo lectura
      - ./data:/data:ro                    # el CSV original, visible en /data para subirlo a HDFS (solo lectura)
    environment:
      - CLUSTER_NAME=steam
      - HADOOP_HEAPSIZE_MAX=512m       # tope de memoria de Java (-Xmx); el contenedor tiene 1 GB
      - HDFS_CONF_dfs_replication=2                          # 2 copias de cada bloque
      # OJO (19 oct, Desafio 2): la linea siguiente NO se aplica. En las imagenes bde2020
      # el guion de una propiedad se escribe "___" (recheck___interval); con "-" el ajuste
      # se ignora y el NameNode usa el valor por defecto (300 s): un DataNode caido se
      # detecta en ~10-15 min (medido: 655 s; hdfs getconf da 300000). La linea viene igual
      # del compose del profesor. Se deja asi a proposito para no recrear el NameNode antes
      # de la entrega (decision 65).
      - HDFS_CONF_dfs_namenode_heartbeat_recheck-interval=2000
      - HDFS_CONF_dfs_heartbeat_interval=1                   # latido de 1 s (los DataNodes tambien lo llevan, ver abajo)
    env_file:
      - ./docker/hadoop.env
    mem_limit: 1g                  # maximo de RAM para este contenedor

  # ------------------------------------------------------------------
  # DataNodes: guardan los bloques de datos (2 nodos -> replicacion 2)
  # ------------------------------------------------------------------
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1            # asi la web de HDFS y "hdfs fsck" muestran "datanode1" y no un ID
    restart: unless-stopped
    command: ["/bin/bash", "/opt/steam/run-datanode.sh"]   # arranque con "exec" (ver namenode)
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
      - ./docker/run-datanode.sh:/opt/steam/run-datanode.sh:ro
    environment:
      SERVICE_PRECONDITION: "namenode:9870"   # espera a que el NameNode este listo
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_heartbeat_interval: 1     # latido ('sigo vivo') cada 1 s, igual que espera el NameNode
      HADOOP_HEAPSIZE_MAX: 384m               # tope de memoria de Java (-Xmx); el contenedor tiene 768 MB
    env_file:
      - ./docker/hadoop.env
    mem_limit: 768m

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2            # asi la web de HDFS y "hdfs fsck" muestran "datanode2" y no un ID
    restart: unless-stopped
    command: ["/bin/bash", "/opt/steam/run-datanode.sh"]   # arranque con "exec" (ver namenode)
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
      - ./docker/run-datanode.sh:/opt/steam/run-datanode.sh:ro
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_heartbeat_interval: 1
      HADOOP_HEAPSIZE_MAX: 384m
    env_file:
      - ./docker/hadoop.env
    mem_limit: 768m

  # ------------------------------------------------------------------
  # Spark: master (reparte el trabajo) y worker (lo ejecuta).
  # Usan EXACTAMENTE la misma imagen que Jupyter (fijada por su digest)
  # para que Spark (4.2.0) y Python (3.13.15) coincidan en todos lados.
  # ------------------------------------------------------------------
  spark-master:
    image: quay.io/jupyter/pyspark-notebook@sha256:7cad53570e4d168b17a453d190601c677a08836992f8b04888a627a5532e3614
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    command:
      - /usr/local/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"                       # puerto por el que los workers y Jupyter hablan con el master
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"                  # web del master
    environment:
      - SPARK_DAEMON_MEMORY=512m     # memoria de Java del propio master
    healthcheck:                     # "sano" = su web responde (sustituye al chequeo de Jupyter de la imagen)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://spark-master:8080', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 768m

  spark-worker:
    image: quay.io/jupyter/pyspark-notebook@sha256:7cad53570e4d168b17a453d190601c677a08836992f8b04888a627a5532e3614
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command:
      - /usr/local/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077    # direccion del master al que se apunta
      - --host
      - spark-worker
      - --webui-port
      - "8081"
    ports:
      - "8081:8081"                  # web del worker
    environment:
      - SPARK_WORKER_CORES=4         # tasks que puede ejecutar a la vez
      - SPARK_WORKER_MEMORY=2g       # memoria que ofrece a los executors
      - SPARK_DAEMON_MEMORY=512m     # memoria de Java del propio worker
      - SPARK_WORKER_DIR=/tmp/spark-work   # carpeta de trabajo con permisos de escritura
    healthcheck:                     # "sano" = su web responde
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://spark-worker:8081', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2816m                 # 2 GB executors + 512 MB worker + margen

  # ------------------------------------------------------------------
  # Jupyter: nuestro entorno de desarrollo (el enunciado pide "un entorno
  # de desarrollo con PySpark instalado ... que pueda conectarse al cluster").
  # Desde sus notebooks, Spark actua como "driver" (el cerebro que planifica)
  # y manda el trabajo al master, que lo reparte al worker.
  # Usa EXACTAMENTE la misma imagen que master y worker (mismo digest), para
  # que Python y Spark coincidan (si no, Spark da PYTHON_VERSION_MISMATCH).
  # La forma de lanzarlo sigue la clase del profesor (Topic 4, "Setup: Spark
  # in Docker"): puertos 8888 y 4040, carpeta montada en /home/jovyan/work,
  # usuario root solo para arreglar permisos al arrancar (CHOWN_EXTRA).
  # ------------------------------------------------------------------
  jupyter:
    image: quay.io/jupyter/pyspark-notebook@sha256:7cad53570e4d168b17a453d190601c677a08836992f8b04888a627a5532e3614
    container_name: jupyter
    hostname: jupyter                # los executors usan este nombre para devolver resultados al driver
    restart: unless-stopped
    depends_on:
      - spark-master
    user: root                       # solo para el arreglo de permisos; Jupyter se ejecuta luego como usuario normal (jovyan)
    ports:
      - "127.0.0.1:8888:8888"        # Jupyter Lab. "127.0.0.1" = solo accesible desde este PC (Jupyter ejecuta codigo)
      - "127.0.0.1:4040:4040"        # web de Spark del programa que este corriendo (Jobs, Stages, SQL...)
    volumes:
      - .:/home/jovyan/work          # TODA la carpeta del proyecto: notebooks/, src/, config/... se ven y se guardan en el PC
    environment:
      - JUPYTER_TOKEN=steam          # "contrasena" fija de Jupyter (en vez de copiarla del log cada vez)
      - CHOWN_EXTRA=/home/jovyan/work   # al arrancar, da permisos sobre la carpeta montada al usuario de Jupyter
      - CHOWN_EXTRA_OPTS=-R          # ... a todo lo que hay dentro (igual que en la clase del profesor)
    mem_limit: 2g                    # driver de Spark (~1 GB) + Python + Jupyter + margen

  # ------------------------------------------------------------------
  # YARN (perfil "yarn"): NO arranca con "docker compose up".
  # Se enciende solo para MapReduce (parte C) con:
  #     docker compose --profile yarn up -d
  # Motivo: con Spark trabajando, tener YARN encendido dejaria la memoria
  # al limite (ver seccion 10 del documento explicativo).
  # ------------------------------------------------------------------
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    hostname: resourcemanager
    profiles: ["yarn"]
    restart: unless-stopped
    command: ["/bin/bash", "/opt/steam/run-resourcemanager.sh"]   # arranque con "exec" (ver namenode)
    ports:
      - "8088:8088"                  # web de YARN (aplicaciones y su estado)
    volumes:
      - ./docker/run-resourcemanager.sh:/opt/steam/run-resourcemanager.sh:ro
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode1:9864 datanode2:9864"
      HADOOP_HEAPSIZE_MAX: 512m      # tope de memoria de Java
    env_file:
      - ./docker/hadoop.env
    mem_limit: 1g                    # Java 512 MB + memoria fuera del heap; en reposo ya usa ~410 MB (medido el 17 oct)

  nodemanager:
    build: ./docker/nodemanager      # imagen del profesor + Python 3 (ver docker/nodemanager/Dockerfile)
    image: steam-bigdata/hadoop-nodemanager-python:1.0
    container_name: nodemanager
    hostname: nodemanager
    profiles: ["yarn"]
    restart: unless-stopped
    command: ["/bin/bash", "/opt/steam/run-nodemanager.sh"]       # arranque con "exec" (ver namenode)
    volumes:
      - ./docker/run-nodemanager.sh:/opt/steam/run-nodemanager.sh:ro
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode1:9864 datanode2:9864 resourcemanager:8088"
      HADOOP_HEAPSIZE_MAX: 384m      # Java del propio NodeManager (las tareas van aparte)
    env_file:
      - ./docker/hadoop.env
    mem_limit: 2816m                 # 2048 MB para tareas (hadoop.env) + 384 MB del NodeManager + margen

# Volumenes: "discos" de Docker donde se guardan los datos de HDFS.
# Sobreviven a "docker compose down"; solo se borran con "docker compose down -v".
volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
